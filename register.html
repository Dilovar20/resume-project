<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация на курс — Давронзода Диловар</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <header>
        <h1>Регистрация на курс / стажировку</h1>
        <p>Заполните форму для подачи заявки</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">← На главную</a></li>
        </ul>
    </nav>

    <main>

        <form action="#" method="post">

            <fieldset>
                <legend>Личные данные</legend>

                <div>
                    <label for="fullname">ФИО:</label>
                    <input type="text" id="fullname" name="fullname"
                           minlength="3" maxlength="80"
                           pattern="[А-Яа-яЁёA-Za-z\s\-]+"
                           required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@kaznu.kz"
                           required>
                </div>

                <div>
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone"
                           pattern="\+?[0-9]{10,15}"
                           placeholder="+77073866372"
                           required>
                </div>

                <div>
                    <label for="birthdate">Дата рождения:</label>
                    <input type="date" id="birthdate" name="birthdate"
                           min="1950-01-01" max="2010-12-31"
                           required>
                </div>

                <div>
                    <label for="age">Возраст:</label>
                    <input type="number" id="age" name="age"
                           min="14" max="80"
                           required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Пол</legend>

                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Мужской</label><br>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Женский</label>
            </fieldset>

            <fieldset>
                <legend>Город</legend>

                <label for="city">Выберите город:</label>
                <select id="city" name="city" required>
                    <option value="">-- Выберите --</option>
                    <option value="almaty">Алматы</option>
                    <option value="astana">Астана</option>
                    <option value="shymkent">Шымкент</option>
                    <option value="karaganda">Караганда</option>
                    <option value="other">Другой</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Направление обучения</legend>

                <label for="direction">Направление:</label>
                <select id="direction" name="direction" required>
                    <option value="">-- Выберите --</option>
                    <option value="frontend">Frontend-разработка</option>
                    <option value="backend">Backend-разработка</option>
                    <option value="mobile">Мобильная разработка</option>
                    <option value="data">Data Science</option>
                    <option value="devops">DevOps</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Интересы</legend>

                <input type="checkbox" id="interest-html" name="interests" value="html">
                <label for="interest-html">HTML / CSS</label><br>

                <input type="checkbox" id="interest-js" name="interests" value="js">
                <label for="interest-js">JavaScript</label><br>

                <input type="checkbox" id="interest-python" name="interests" value="python">
                <label for="interest-python">Python</label><br>

                <input type="checkbox" id="interest-sql" name="interests" value="sql">
                <label for="interest-sql">SQL / Базы данных</label>
            </fieldset>

            <fieldset>
                <legend>Уровень подготовки</legend>

                <input type="radio" id="level-beginner" name="level" value="beginner" required>
                <label for="level-beginner">Новичок</label><br>

                <input type="radio" id="level-middle" name="level" value="middle">
                <label for="level-middle">Средний</label><br>

                <input type="radio" id="level-advanced" name="level" value="advanced">
                <label for="level-advanced">Продвинутый</label>
            </fieldset>

            <fieldset>
                <legend>Дополнительно</legend>

                <label for="comment">Комментарий (необязательно):</label>
                <textarea id="comment" name="comment" rows="4" maxlength="500"></textarea>
            </fieldset>

            <fieldset>
                <legend>Согласие</legend>

                <input type="checkbox" id="agree" name="agree" value="yes" required>
                <label for="agree">Согласен с обработкой персональных данных</label>
            </fieldset>

            <button type="submit">Отправить заявку</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Давронзода Диловар</p>
    </footer>

</body>
</html>
